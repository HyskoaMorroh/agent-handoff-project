name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 三个平台都跑，因为这个工具的整个卖点之一是跨平台：
    # 路径分隔符、venv 布局、换行风格、浏览器打开方式各不相同。
    runs-on: ${{ matrix.os }}
    # 套件本地实测约 400 秒，最慢的 runner 上翻倍也够。卡死时不该挂到
    # GitHub 的默认上限（6 小时）——那会白烧 9 个矩阵组合的额度，
    # 而且看不出是卡死还是在跑。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        # 中间版本只在 Linux 上跑，省 CI 时间又不丢覆盖。
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure git identity
        # 测试会真的跑 git commit；CI 的 runner 默认没有身份。
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        # scripts/ 也要过：build_guide.py 与 check_i18n.py 是 CI 自己依赖的工具，
        # 它们坏掉会让 i18n 与指南的门失效，却又不在 src/ 里。
        run: python -m ruff check src tests scripts

      - name: Test
        run: python -m pytest -q
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

  i18n:
    # 三种语言的键必须完全一致，占位符也必须一致——缺一个键界面上就出现 ??key??
    # 同时校验源码里没有绕过文案表的中文字面量：那种串切了语言也不会动。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check translation parity
        run: python scripts/check_i18n.py
      - name: Guide is in sync with its sources
        # guide.html 是生成物。重建后如果有 diff，说明有人改了 JSON 却没重建。
        run: |
          python scripts/build_guide.py
          git diff --exit-code docs/guide.html
      - name: Version and badges agree everywhere
        # 版本写在三处（pyproject、__init__、三份 README 的徽章），全靠人手同步。
        # 漂移的后果是 --version、guide 顶栏、README 徽章三者不一致，
        # 读者只会当成「文档不可信」——而那正是这个工具最不能背的名声。
        # 测试数徽章同理：实测曾停在 392 而真实数字是 589。
        run: |
          python - <<'PY'
          import re, sys, tomllib
          from pathlib import Path

          problems = []
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          want = pyproject["project"]["version"]

          init = Path("src/agent_handoff/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*"([^"]+)"', init)
          if not m:
              problems.append("__init__.py: no __version__ found")
          elif m.group(1) != want:
              problems.append(f"__init__.py says {m.group(1)}, pyproject says {want}")

          # 真实用例数：与徽章比对，避免徽章长期停在旧数字。
          collected = 0
          for fp in sorted(Path("tests").glob("test_*.py")):
              collected += len(re.findall(r"^def (test_\w+)", fp.read_text(encoding="utf-8"), re.M))

          for name in ("README.md", "README.en.md", "README.zh-Hant.md"):
              text = Path(name).read_text(encoding="utf-8")
              vm = re.search(r"badge/version-([0-9][^-]*)-", text)
              if not vm:
                  problems.append(f"{name}: no version badge")
              elif vm.group(1) != want:
                  problems.append(f"{name} badge says {vm.group(1)}, pyproject says {want}")
              tm = re.search(r"badge/tests-(\d+)%20passed", text)
              if not tm:
                  problems.append(f"{name}: no tests badge")
              else:
                  claimed = int(tm.group(1))
                  # 参数化用例会让真实收集数高于 def 计数，所以只挡「徽章比
                  # def 计数还少」这种明显过时的情形，不做精确相等。
                  if claimed < collected:
                      problems.append(
                          f"{name} claims {claimed} tests but at least {collected} exist"
                      )

          if problems:
              sys.exit("version/badge drift:\n  " + "\n  ".join(problems))
          print(f"version {want} consistent; test badges >= {collected} def-counted tests")
          PY

  e2e:
    # 端到端：在真 Linux 上建一个仓库、跑一次交接、检查产物。
    # 单元测试覆盖不到的是这几件事：POSIX venv 布局被识别、受保护文件真的
    # 没进 git、交接文件是纯 LF、计划文档的复选框真的被回填。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Install
        run: python -m pip install -e .
      - name: Run against a synthetic repository
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/docs" "$work/pkg"
          cd "$work"
          git init -q
          cat > docs/plan.md <<'PLAN'
          # Plan

          **Goal:** ship the widget pipeline.

          ## Global Constraints
          - `docs/LOGO.jpg` is a user-owned file and must not be committed.

          ### Task 1: core

          **Files:**
          - Create: `pkg/core.py`

          **Interfaces:**
          - Produces: `build_widget`

          - [ ] **Step 1** write core
          - [ ] **Step 2** test core

          ### Task 2: render

          **Files:**
          - Create: `pkg/render.py`

          **Interfaces:**
          - Produces: `render_widget`

          - [ ] **Step 1** write render
          PLAN
          printf 'def build_widget():\n    return 1\n' > pkg/core.py
          printf '\xff\xd8logo' > docs/LOGO.jpg
          mkdir -p .venv/bin && ln -sf "$(command -v python3)" .venv/bin/python
          git add docs/plan.md pkg/core.py
          git commit -q -m init

          agent-handoff . --no-vitals --lang en | tee /tmp/run.log

          # Task 1 完整（文件+符号齐）-> 两步被勾上；Task 2 缺 -> 不勾。
          test "$(grep -c '^- \[x\]' docs/plan.md)" = 2

          # 受保护文件永不进 git。这条失守就是把用户私有文件提交上去了。
          if git ls-files | grep -q LOGO; then echo "protected file leaked"; exit 1; fi

          # 交接文件必须是纯 LF，两个平台字节一致。
          handoff=$(ls docs/*-handoff.md)
          if grep -q $'\r' "$handoff"; then echo "handoff has CRLF"; exit 1; fi

          # POSIX venv 布局要被认出来，否则交接文件里的测试命令跑不起来。
          grep -q '.venv/bin/python' "$handoff"

          # 提示词必须点名意图段落与已完成任务，否则新会话会重做已完成的工作。
          grep -q 'Global Constraints' /tmp/run.log
          grep -q 'Do not redo Task 1' /tmp/run.log
          grep -q 'missing symbol render_widget' /tmp/run.log

          echo "e2e ok"

  e2e-windows:
    # Windows 是这个工具的主要使用环境（转录默认就在 %USERPROFILE% 下），
    # 但端到端此前只在 Linux 上跑。这里覆盖 POSIX 侧覆盖不到的几件事：
    # Windows venv 布局（Scripts\ 而不是 bin/）、控制台编码、启动器脚本、
    # 以及交接文件在 Windows 上仍然必须是纯 LF。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Install
        run: python -m pip install -e .
      - name: Run against a synthetic repository
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "e2e-win"
          New-Item -ItemType Directory -Force -Path "$work/docs","$work/pkg" | Out-Null
          Set-Location $work
          git init -q
          @'
          # Plan

          **Goal:** ship the widget pipeline.

          ## Global Constraints
          - `docs/LOGO.jpg` is a user-owned file and must not be committed.

          ### Task 1: core

          **Files:**
          - Create: `pkg/core.py`

          **Interfaces:**
          - Produces: `build_widget`

          - [ ] **Step 1** write core
          - [ ] **Step 2** test core

          ### Task 2: render

          **Files:**
          - Create: `pkg/render.py`

          **Interfaces:**
          - Produces: `render_widget`

          - [ ] **Step 1** write render
          '@ | Set-Content docs/plan.md -Encoding utf8NoBOM
          "def build_widget():`n    return 1" | Set-Content pkg/core.py -Encoding utf8NoBOM
          [System.IO.File]::WriteAllBytes("$work/docs/LOGO.jpg", [byte[]](0xFF,0xD8,0x6C,0x6F,0x67,0x6F))
          # Windows venv 布局：解释器在 Scripts\ 下，不是 bin/。
          New-Item -ItemType Directory -Force -Path "$work/.venv/Scripts" | Out-Null
          Copy-Item (Get-Command python).Source "$work/.venv/Scripts/python.exe"
          git add docs/plan.md pkg/core.py
          git commit -q -m init

          agent-handoff . --no-vitals --lang en *>&1 | Tee-Object -FilePath "$work/run.log"

          $plan = Get-Content docs/plan.md -Raw
          $ticked = ([regex]::Matches($plan, '(?m)^- \[x\]')).Count
          if ($ticked -ne 2) { throw "expected 2 ticked steps, got $ticked" }

          if (git ls-files | Select-String -Quiet LOGO) { throw "protected file leaked" }

          $handoff = (Get-ChildItem docs/*-handoff.md)[0].FullName
          $bytes = [System.IO.File]::ReadAllBytes($handoff)
          if ($bytes -contains 13) { throw "handoff has CRLF on Windows" }

          # Windows venv 布局要被认出来，否则交接文件里的测试命令跑不起来。
          if (-not (Select-String -Path $handoff -Pattern '\.venv[/\\]Scripts[/\\]python' -Quiet)) {
            throw "Windows venv layout not detected"
          }

          $log = Get-Content "$work/run.log" -Raw
          foreach ($needle in 'Global Constraints', 'Do not redo Task 1', 'missing symbol render_widget') {
            if ($log -notlike "*$needle*") { throw "prompt missing: $needle" }
          }

          Write-Output "e2e-windows ok"

      - name: Launcher script works
        shell: cmd
        run: |
          call scripts\agent-handoff.cmd --version || exit /b 1

  build:
    runs-on: ubuntu-latest
    needs: [test, i18n, e2e, e2e-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          # 图文说明的包内副本由 build_guide.py 生成，且不进 git——
          # 打包前必须先跑它，否则 wheel 里没有 guide.html。
          python scripts/build_guide.py
          python -m build
      - name: Verify package data is bundled
        # i18n JSON 与 GUI 静态资源必须进 wheel，否则装完之后界面是空的。
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          need = [
              "agent_handoff/i18n/zh-Hans.json",
              "agent_handoff/i18n/zh-Hant.json",
              "agent_handoff/i18n/en.json",
              "agent_handoff/gui/static/index.html",
              "agent_handoff/gui/static/style.css",
              "agent_handoff/gui/static/app.js",
              # 图文说明。docs/ 从不进 wheel，靠打包前复制进 gui/static/。
              # 少了它，装好的包里「指南」入口必然 404。
              "agent_handoff/gui/static/guide.html",
              # --sweep 的实现。曾经有一个 wheel 漏掉这个模块，
              # 而 README 与 CHANGELOG 通篇在讲这个功能。
              "agent_handoff/core/disk.py",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit("missing from wheel: " + ", ".join(missing))
          print("wheel contains all package data")
          PY
      - name: Install the wheel and smoke-test it
        # 只检查文件名在不在是不够的：那只证明文件进了压缩包，
        # 不证明装好之后找得到、跑得起来。此前 guide.html 的 404 缺陷
        # 正是被这个缺口放过的——文件名检查全绿，装完却打不开说明书。
        #
        # 在一个干净目录里装、在干净目录里跑：模拟另一台电脑，
        # 避免从仓库检出里意外读到 docs/ 或 src/。
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/python -m pip install --quiet dist/*.whl
          mkdir -p /tmp/elsewhere
          cd /tmp/elsewhere
          /tmp/wheeltest/bin/agent-handoff --version
          # 三种语言都要能起来：i18n JSON 少一份就会在这里失败。
          for lang in zh-Hans zh-Hant en; do
            /tmp/wheeltest/bin/agent-handoff --lang "$lang" --help > /dev/null
          done
          # --sweep 只读转录元信息，在没有转录的 runner 上也应正常退出。
          /tmp/wheeltest/bin/agent-handoff --sweep > /dev/null
          # 图文说明必须能从装好的包里找到。
          /tmp/wheeltest/bin/python - <<'PY'
          from agent_handoff.platform import find_guide
          g = find_guide()
          assert g is not None, "find_guide() returned None from an installed wheel"
          assert g.is_file(), f"not a file: {g}"
          size = g.stat().st_size
          assert size > 10_000, f"guide.html looks truncated: {size} bytes"
          print(f"guide found in the installed package: {size} bytes")
          PY
          echo "wheel smoke test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
