name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 三个平台都跑，因为这个工具的整个卖点之一是跨平台：
    # 路径分隔符、venv 布局、换行风格、浏览器打开方式各不相同。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        # 中间版本只在 Linux 上跑，省 CI 时间又不丢覆盖。
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure git identity
        # 测试会真的跑 git commit；CI 的 runner 默认没有身份。
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -q
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

  i18n:
    # 三种语言的键必须完全一致，占位符也必须一致——缺一个键界面上就出现 ??key??
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check translation parity
        run: python scripts/check_i18n.py

  build:
    runs-on: ubuntu-latest
    needs: [test, i18n]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify package data is bundled
        # i18n JSON 与 GUI 静态资源必须进 wheel，否则装完之后界面是空的。
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          need = [
              "agent_handoff/i18n/zh-Hans.json",
              "agent_handoff/i18n/zh-Hant.json",
              "agent_handoff/i18n/en.json",
              "agent_handoff/gui/static/index.html",
              "agent_handoff/gui/static/style.css",
              "agent_handoff/gui/static/app.js",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit("missing from wheel: " + ", ".join(missing))
          print("wheel contains all package data")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
