name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 三个平台都跑，因为这个工具的整个卖点之一是跨平台：
    # 路径分隔符、venv 布局、换行风格、浏览器打开方式各不相同。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        # 中间版本只在 Linux 上跑，省 CI 时间又不丢覆盖。
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure git identity
        # 测试会真的跑 git commit；CI 的 runner 默认没有身份。
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -q
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

  i18n:
    # 三种语言的键必须完全一致，占位符也必须一致——缺一个键界面上就出现 ??key??
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check translation parity
        run: python scripts/check_i18n.py
      - name: Guide is in sync with its sources
        # guide.html 是生成物。重建后如果有 diff，说明有人改了 JSON 却没重建。
        run: |
          python scripts/build_guide.py
          git diff --exit-code docs/guide.html

  e2e:
    # 端到端：在真 Linux 上建一个仓库、跑一次交接、检查产物。
    # 单元测试覆盖不到的是这几件事：POSIX venv 布局被识别、受保护文件真的
    # 没进 git、交接文件是纯 LF、计划文档的复选框真的被回填。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Install
        run: python -m pip install -e .
      - name: Run against a synthetic repository
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/docs" "$work/pkg"
          cd "$work"
          git init -q
          cat > docs/plan.md <<'PLAN'
          # Plan

          **Goal:** ship the widget pipeline.

          ## Global Constraints
          - `docs/LOGO.jpg` is a user-owned file and must not be committed.

          ### Task 1: core

          **Files:**
          - Create: `pkg/core.py`

          **Interfaces:**
          - Produces: `build_widget`

          - [ ] **Step 1** write core
          - [ ] **Step 2** test core

          ### Task 2: render

          **Files:**
          - Create: `pkg/render.py`

          **Interfaces:**
          - Produces: `render_widget`

          - [ ] **Step 1** write render
          PLAN
          printf 'def build_widget():\n    return 1\n' > pkg/core.py
          printf '\xff\xd8logo' > docs/LOGO.jpg
          mkdir -p .venv/bin && ln -sf "$(command -v python3)" .venv/bin/python
          git add docs/plan.md pkg/core.py
          git commit -q -m init

          agent-handoff . --no-vitals --lang en | tee /tmp/run.log

          # Task 1 完整（文件+符号齐）-> 两步被勾上；Task 2 缺 -> 不勾。
          test "$(grep -c '^- \[x\]' docs/plan.md)" = 2

          # 受保护文件永不进 git。这条失守就是把用户私有文件提交上去了。
          if git ls-files | grep -q LOGO; then echo "protected file leaked"; exit 1; fi

          # 交接文件必须是纯 LF，两个平台字节一致。
          handoff=$(ls docs/*-handoff.md)
          if grep -q $'\r' "$handoff"; then echo "handoff has CRLF"; exit 1; fi

          # POSIX venv 布局要被认出来，否则交接文件里的测试命令跑不起来。
          grep -q '.venv/bin/python' "$handoff"

          # 提示词必须点名意图段落与已完成任务，否则新会话会重做已完成的工作。
          grep -q 'Global Constraints' /tmp/run.log
          grep -q 'Do not redo Task 1' /tmp/run.log
          grep -q 'missing symbol render_widget' /tmp/run.log

          echo "e2e ok"

  build:
    runs-on: ubuntu-latest
    needs: [test, i18n, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify package data is bundled
        # i18n JSON 与 GUI 静态资源必须进 wheel，否则装完之后界面是空的。
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          need = [
              "agent_handoff/i18n/zh-Hans.json",
              "agent_handoff/i18n/zh-Hant.json",
              "agent_handoff/i18n/en.json",
              "agent_handoff/gui/static/index.html",
              "agent_handoff/gui/static/style.css",
              "agent_handoff/gui/static/app.js",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit("missing from wheel: " + ", ".join(missing))
          print("wheel contains all package data")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
