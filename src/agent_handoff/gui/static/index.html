<!DOCTYPE html>
<html lang="zh-Hans" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Salvage</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2324664A'/%3E%3Cpath d='M9 20l5-9 4 6 2-3 3 6z' fill='%23fff'/%3E%3C/svg%3E">
<script id="bootstrap" type="application/json">__BOOTSTRAP__</script>
</head>
<body>
<div class="shell">

  <aside class="rail">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9"/>
        <path d="M8.5 21.5l5.2-9.4 4.1 6.2 2.1-3.2 3.6 6.4z"/>
      </svg>
      <div class="brand-text">
        <strong data-i18n="gui.title">Session Salvage</strong>
        <span data-i18n="gui.subtitle"></span>
      </div>
    </div>

    <!-- role="tablist" 要配齐：每个 tab 用 aria-controls 指向自己的面板，
         面板带 role="tabpanel" 与 aria-labelledby 指回来。此前只有 tablist 与
         aria-selected，读屏软件会念出「标签页」却找不到对应面板，用户听到的是
         一组孤立按钮。tabindex 由 JS 维护（选中的为 0、其余 -1），这样 Tab 键
         一次跳过整组、方向键在组内移动——这是 ARIA 的 tab 模式要求的行为。 -->
    <nav class="nav" role="tablist" aria-label="Views" data-i18n-aria="gui.a11y.views">
      <button class="nav-item is-active" role="tab" id="tab-vitals"
              aria-controls="panel-vitals" data-view="vitals" aria-selected="true" tabindex="0">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 12h3.2l1.8-5 2.6 9L12.6 8l1.4 4H18"/></svg>
        <span data-i18n="gui.nav.vitals"></span>
      </button>
      <button class="nav-item" role="tab" id="tab-handoff"
              aria-controls="panel-handoff" data-view="handoff" aria-selected="false" tabindex="-1">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 15V5h7l5 5v5z"/><path d="M11 5v5h5"/></svg>
        <span data-i18n="gui.nav.handoff"></span>
      </button>
      <button class="nav-item" role="tab" id="tab-find"
              aria-controls="panel-find" data-view="find" aria-selected="false" tabindex="-1">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.2"/><path d="M13 13l4 4"/></svg>
        <span data-i18n="gui.nav.find"></span>
      </button>
      <button class="nav-item" role="tab" id="tab-doctor"
              aria-controls="panel-doctor" data-view="doctor" aria-selected="false" tabindex="-1">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M3 10h14"/><circle cx="10" cy="10" r="7.5"/></svg>
        <span data-i18n="gui.nav.doctor"></span>
      </button>
      <!-- 说明文档是外部链接而不是一个视图：它自带三语与完整渲染逻辑，
           塞进这里只会有两套语言切换互相打架。仓库里没有 docs/ 时由 JS 隐藏。 -->
      <a class="nav-item" id="nav-guide" href="/guide.html" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h8l4 4v8H4z"/><path d="M7 9h6M7 12h6"/></svg>
        <span data-i18n="gui.nav.guide"></span>
      </a>
    </nav>

    <div class="rail-foot">
      <div class="seg" id="lang-seg" role="group" aria-label="Language" data-i18n-aria="gui.a11y.lang"></div>
      <div class="seg" id="theme-seg" role="group" aria-label="Theme" data-i18n-aria="gui.a11y.theme">
        <button data-theme-set="light" title="light">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.4 4.4l1.4 1.4M14.2 14.2l1.4 1.4M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4"/></svg>
        </button>
        <button data-theme-set="auto" title="auto">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.4"/><path d="M10 3.6v12.8" /><path d="M10 3.6a6.4 6.4 0 010 12.8z" class="fill"/></svg>
        </button>
        <button data-theme-set="dark" title="dark">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14.8 12.4A6 6 0 017.6 5.2a6.2 6.2 0 100 9.6 6 6 0 007.2-2.4z"/></svg>
        </button>
      </div>
      <p class="ver">v<span id="ver"></span></p>
    </div>
  </aside>

  <main class="main">

    <!-- ── 体检 ─────────────────────────────────────────────── -->
    <section class="view is-active" data-view="vitals"
             id="panel-vitals" role="tabpanel" aria-labelledby="tab-vitals" tabindex="0">
      <header class="head">
        <h1 data-i18n="gui.vitals.title"></h1>
        <p data-i18n="gui.vitals.lead"></p>
      </header>

      <div class="bar">
        <button class="btn btn-primary" id="scan-btn" data-i18n="gui.vitals.scan"></button>
        <label class="check">
          <input type="checkbox" id="scan-deep" checked>
          <span data-i18n="gui.vitals.deep"></span>
        </label>
        <!-- 勾选计数：勾在体检视图，交接在另一个视图，中间要有个东西
             告诉用户「你已经选了几个」，否则切过去就不记得选没选。 -->
        <span class="pick-count" id="pick-count"></span>
      </div>

      <div class="stats" id="vitals-stats" hidden>
        <div class="stat"><span class="stat-n" id="st-total">—</span><span class="stat-k" data-i18n="gui.vitals.stat.total"></span></div>
        <div class="stat"><span class="stat-n" id="st-risky">—</span><span class="stat-k" data-i18n="gui.vitals.stat.risky"></span></div>
        <div class="stat"><span class="stat-n" id="st-size">—</span><span class="stat-k" data-i18n="gui.vitals.stat.size"></span></div>
      </div>

      <div id="vitals-out" class="stack"></div>
    </section>

    <!-- ── 交接 ─────────────────────────────────────────────── -->
    <section class="view" data-view="handoff"
             id="panel-handoff" role="tabpanel" aria-labelledby="tab-handoff" tabindex="0">
      <header class="head">
        <h1 data-i18n="gui.handoff.title"></h1>
        <p data-i18n="gui.handoff.lead"></p>
      </header>

      <div class="card form">
        <label class="field">
          <span class="field-k" data-i18n="gui.handoff.repo"></span>
          <input type="text" id="repo" spellcheck="false" autocomplete="off">
        </label>
        <div class="opts">
          <label class="check"><input type="checkbox" id="o-skip-tests" checked><span data-i18n="gui.handoff.opt.skip_tests"></span></label>
          <label class="check"><input type="checkbox" id="o-no-commit"><span data-i18n="gui.handoff.opt.no_commit"></span></label>
          <label class="check"><input type="checkbox" id="o-no-vitals"><span data-i18n="gui.handoff.opt.no_vitals"></span></label>
          <label class="check"><input type="checkbox" id="o-force"><span data-i18n="gui.handoff.opt.force"></span></label>
          <label class="check"><input type="checkbox" id="o-bundle"><span data-i18n="gui.handoff.opt.bundle"></span></label>
        </div>
        <p class="will" id="will" role="status" aria-live="polite"></p>
        <div class="bar">
          <button class="btn" id="dry-btn" data-i18n="gui.handoff.dry"></button>
          <button class="btn btn-primary" id="run-btn" data-i18n="gui.handoff.run"></button>
        </div>
      </div>

      <div id="handoff-out" class="stack"></div>
    </section>

    <!-- ── 找会话 ───────────────────────────────────────────── -->
    <section class="view" data-view="find"
             id="panel-find" role="tabpanel" aria-labelledby="tab-find" tabindex="0">
      <header class="head">
        <h1 data-i18n="gui.find.title"></h1>
        <p data-i18n="gui.find.lead"></p>
      </header>
      <div class="card form">
        <label class="field">
          <span class="field-k" data-i18n="gui.nav.find"></span>
          <input type="text" id="find-q" spellcheck="false" autocomplete="off">
        </label>
        <div class="bar"><button class="btn btn-primary" id="find-btn" data-i18n="gui.find.go"></button></div>
      </div>
      <div id="find-out" class="stack"></div>
    </section>

    <!-- ── 环境自检 ─────────────────────────────────────────── -->
    <!-- 首次上手要回答的第一个问题是「这个工具能看见我的会话吗」。此前没有
         任何地方回答它：后端把 gitAvailable 广播给了前端，前端从不读，于是
         git 缺失只在交接跑到第四步时才暴露；缺 zstd 更糟——7 天前的 Codex
         会话整批变成空壳，而列表看起来完全正常。这一屏把这些提前摆出来。 -->
    <section class="view" data-view="doctor"
             id="panel-doctor" role="tabpanel" aria-labelledby="tab-doctor" tabindex="0">
      <header class="head">
        <h1 data-i18n="doctor.head"></h1>
        <p data-i18n="doctor.lead"></p>
      </header>
      <div class="bar">
        <button class="btn btn-primary" id="doctor-btn" data-i18n="gui.doctor.run"></button>
      </div>
      <!-- 结果区是 aria-live：自检是用户主动触发的异步动作，完成时屏幕阅读器
           必须听到结论，否则按下按钮之后毫无反馈。 -->
      <div id="doctor-out" class="stack" role="status" aria-live="polite"></div>
    </section>

  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
