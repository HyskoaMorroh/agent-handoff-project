<script id="guide-i18n" type="application/json">{"zh-Hans":{"lang":"zh-Hans","dir_note":"简体中文","title":"会话交接工具 · 图文说明","tagline":"会话卡死时，把进度从对话里搬进仓库","eyebrow":"本机实测 · 54 个 Claude + 54 个 Codex 转录","gauge.axis":"转录体积区间","gauge.metric":"该区间出现过致命错误的比例","gauge.foot":"分档不是拍脑袋，但它只是兜底判据。真正的判定看上下文占用，那个数字直接从转录里读出来（Claude 记在 message.usage，Codex 的 token_count 事件还带模型上限）；只有转录里读不到 token 数才退回体积。体积与真实占用严重脱钩：实测一个 1.0 MB 的会话已用 194,183 token，一个 2.0 MB 的会话已经压缩过 10 次。页面后面每一个徽章、每一条色边都取自这四档，颜色本身携带严重度。","nav":"目录","s1.h":"会话死了，什么跟着死","s1.p1":"代码不会死。代码在磁盘上，git 里也有。死掉的是<strong>只存在于那段对话里的东西<\/strong>：","s1.li1":"目标 —— 你到底要做成什么样","s1.li2":"已经排除的方案 —— 试过、不行、别再试","s1.li3":"红线 —— 哪个文件绝对不能碰","s1.li4":"下一步 —— 上一个会话正打算做什么","s1.p2":"新会话拿不到这些，于是它重做已完成的工作，或者改掉你明确说过不能碰的文件。这个工具把这四样东西固化成仓库里的文件，让新会话自己读。","sn.h":"先读这一节：什么时候不该用它","sn.p1":"同一个 APP、同一台机器、同一个供应商、上下文没满、会话文件完好时——<strong>用原生续接，不要用这个工具<\/strong>。","sn.p2":"原生续接恢复的是<strong>完整对话历史<\/strong>（Claude Code 官方文档：「the full history, including tool calls and results」），即原样重放 token，<strong>无损<\/strong>。本工具产出的是<strong>有损摘要<\/strong>，不可能等于无损重放。它的价值只在原生续接<strong>结构性做不到<\/strong>的七类场景：","sn.t.case":"场景","sn.t.why":"为什么原生做不到","sn.c1.a":"上下文已耗尽","sn.c1.b":"官方自己的解法也是压缩摘要——闲置 1 小时 + 超 10 万 token 时弹「Resume from summary」，等于跑 <code>/compact<\/code>","sn.c2.a":"跨 APP：Claude Code ↔ Codex","sn.c2.b":"两边格式与事件语义完全不同，<strong>无任何官方导入机制<\/strong>","sn.c3.a":"换模型 / 换供应商","sn.c3.b":"文档明列：模型在已退役、被 <code>--model<\/code> 覆盖、或 Bedrock 等部署 ID 供应商上<strong>不恢复<\/strong>","sn.c4.a":"会话文件损坏","sn.c4.b":"<code>Failed to resume the conversation<\/code>，退出码 1","sn.c5.a":"要丢弃被污染的历史","sn.c5.b":"原生只能全带或摘要；<code>/branch<\/code> 是复制而非裁剪","sn.c6.a":"跨机器","sn.c6.b":"转录可以拷，但官方按 ID 查找只在「恰好一个项目持有该 ID」时才解析，手工副本会被判 not-found","sn.c7.a":"plan mode / 后台任务 / MCP / CLI 启动参数","sn.c7.b":"文档明列<strong>永不恢复<\/strong>——写进交接文档反而更可靠","sn.h2":"哪些东西原理上传不过去","sn.p3":"工具会把这一段写进生成的提示词，免得接续会话把「摘要里没有」当成「没发生过」，于是把上一个会话已经排除的方案重新试一遍。","sn.x1":"模型内部推理状态与 prompt 缓存——<code>encrypted_content<\/code> 是服务端加密串，换会话即失效","sn.x2":"工具授权运行时态——新会话会重新弹权限确认","sn.x3":"MCP 连接与认证令牌——转录只记工具<strong>名字<\/strong>，不记连接","sn.x4":"后台进程、监听端口、已启动的服务——「服务已启动」的假设会失效","sn.x5":"被否决方案的推理过程——thinking 无签名不可回放，且多在子代理转录里（实测子代理「过程 : 报告」= <strong>124 : 1<\/strong>，14.6 MB 过程 vs 118 KB 报告）","s2.h":"什么时候该跑它","s2.p1":"三个触发点，任何一个出现就跑：","s2.li1":"对话开始变慢、工具调用频繁失败、上游返回 400 或熔断提示","s2.li2":"你已经在想「要不要重开一个会话」","s2.li3":"体检结果显示某个会话进了「立刻交接」区间","s2.h2":"54 + 54 个会话实际怎么结束的","s2.p0":"<strong>判定看上下文占用，不是文件体积。<\/strong> 占用数就写在转录里：Claude 记在 <code>message.usage<\/code>，Codex 的 <code>token_count<\/code> 事件还额外带 <code>model_context_window<\/code>——所以 Codex 侧能算出真占用率，Claude 侧则拿占用量对照按 200k 窗口折算的阈值。已经压缩过的会话直接按「满过」对待：自动压缩只在上下文装不下时才触发，而每次压缩都会丢掉更早的历史，所以压缩一次即「尽快交接」，两次以上「立刻交接」。","s2.p0b":"本机实测四个转录说明体积替代不了占用：1.0 MB / 194,183 token（体积会判<em>健康<\/em>）、2.0 MB / 压缩 10 次（体积会判<em>留意<\/em>）、27.4 MB / 710,340 token，以及一个 Codex 会话 121,407 / 121,600 token——占用 99.8%，而体积只会说<em>尽快交接<\/em>。第二个最能说明问题：它体积小<em>恰恰因为<\/em>压缩一直在丢历史。","s2.p2":"下面这套体积分档是读不到 token 数时的兜底。它也不是拍脑袋，是本机 54 个 Claude 转录 + 54 个 Codex 转录的实测分布：","s2.t.size":"转录体积","s2.t.verdict":"判定","s2.t.measured":"实测","s2.r1":"该区间 100% 出现过致命错误","s2.r2":"约三成出现过","s2.r3":"约一成七出现过","s2.r4":"250 KB 以下无一出现过","s2.p3":"「致命错误」指真的杀死过会话的签名：content-blocked、供应商熔断、无可用渠道、图片尺寸超限。只让人烦躁的错误不算。","s2.p4":"另外单独统计<strong>被打断的轮次<\/strong>（<code>turn_aborted<\/code>）。实测 Codex 侧 <code>is_error<\/code> 在 40 个转录里只有 3 次，而 <code>turn_aborted<\/code> 有 6 次——后者才是「这轮没做完」的真实信号，而把半成品当成已完成是交接里最贵的误判。致命错误与中断回答的是「已经出事了没有」，跟「还能撑多久」是两件事；任何一个都会把会话往上抬一档。","s3.h":"怎么用","s3.p1":"三种入口，功能等价，选顺手的：","s3.gui.h":"网页界面","s3.gui.p":"最好看，支持简体／繁體／English 随时切换，浅色深色跟随系统。服务只绑定本机回环地址，每个请求都要一次性令牌 —— 它能对任意路径跑 git commit，所以这不是可选项。","s3.menu.h":"交互菜单","s3.menu.p":"不用记参数。Windows 双击 <code>双击运行.cmd<\/code>，Linux／macOS 跑 <code>./scripts/run.sh<\/code>。把项目文件夹拖进窗口就能填路径。","s3.cli.h":"命令行","s3.cli.p":"适合写进脚本。加 <code>--json<\/code> 可以让输出被程序消费。","s4.h":"四步做了什么","s4.step1.h":"第 1 步 · 提交快照","s4.step1.p":"把工作区的一切提交，但<strong>排除计划文档声明为「用户私有」的文件<\/strong>。识别方式：计划文档里写了「`docs/LOGO.jpg` 是用户私有文件，不得提交」这类句子，路径会被自动加进排除列表。","s4.step1.note":"排除用的是 git 的 <code>:(exclude,literal)<\/code> 长写法而不是 <code>:!path<\/code> 简写：后者在旧版 git 上不支持，且路径含 <code>[<\/code> 或 <code>*<\/code> 时会被当通配符，排除会静默失效 —— 私有文件就被提交上去了。","s4.step2.h":"第 2 步 · 回填计划","s4.step2.p":"按<strong>客观证据<\/strong>勾选复选框，不看任何人的自我报告。一个任务的全部文件都存在、全部符号都真的被 <code>def<\/code>／<code>class<\/code>／<code>function<\/code> 定义了，它的每一步才会被勾上。","s4.step3.h":"第 3 步 · 生成交接","s4.step3.p":"写出一份交接 Markdown（现场、完成度、缺口、测试结果、环境陷阱）和一段可直接粘贴的开场提示词。","s4.step4.note":"提示词里只放话题、会话 ID 与转录路径，完整摘要留在交接文档里——两份多 MB 的转录合计上百万字符，任何提示词都装不下。命令行用 <code>--pick-sessions<\/code> 勾选，或 <code>--sessions PATH<\/code> 直接指定。","sc.h":"传承会话时，实测丢了多少","sc.p1":"Codex 在上下文将满时会自己写一份压缩摘要（<code>compacted<\/code> 事件）。一个会话可以压缩很多次——本机实测 70 个带压缩的转录里 52 个是多窗口，最多 <strong>19 个窗口<\/strong>。关键问题是：后一个窗口有没有包含前一个？","sc.p2":"<strong>不包含。<\/strong> <code>window_number<\/code> 递增、<code>previous_window_id<\/code> 串成链，每个窗口只总结它自己那一段，<strong>没有任何一个样本<\/strong>的末窗逐字包含首窗。所以「只保留最后一次摘要」这个看起来合理的做法，实际会丢掉：","sc.m1.k":"中位 78%","sc.m1.v":"具体事实（commit sha、文件路径、测试计数）在只留末窗时消失；p90 是 96%","sc.m2.k":"11 个转录","sc.m2.v":"的「用户目标 / 红线约束」<strong>只出现在早期窗口<\/strong>——恰恰是最不能丢的那部分","sc.m3.k":"62 / 70","sc.m3.v":"个末窗超过 4000 字符。截断到那个长度会中位切掉 2925 字符、最多 13241 字符，而切掉的往往正是结论与待办","sc.p3":"所以这个工具<strong>保留全部窗口<\/strong>并按时间顺序拼接，也<strong>不截断<\/strong>。修复后实测丢失率 <strong>0%<\/strong>（70/70）。窗口之间加分隔标题——多个窗口各自都有「当前进度」，不分隔会互相矛盾。","sc.p4":"摘要是模型的<em>转述<\/em>，转述会丢措辞里的约束。所以工具还从 <code>replacement_history<\/code> 里取出<strong>用户原话<\/strong>逐字保留——实测某个转录里「将项目 B 推送到 GitHub 并创建 tag」只存在于这里，任何摘要都没有逐字留下它。交接文档把原话单独成节，并注明它优先于任何转述。","si.h":"仓库身份，不是本机路径","si.p1":"提示词同时给两样东西：本机路径，以及 <strong>remote URL + 完整 40 位 sha<\/strong>。路径只是「它在这台机器上的位置」——新会话在另一台机器、容器、WSL 或 Codespaces 里打开时路径不存在；而同一个 remote 下的两个工作副本（<code>proj-a5<\/code> 与 <code>proj-b8<\/code>）也只能靠路径区分。没有远程时工具会明说「只存在于本机，接续必须在同一台机器上」。","si.p2":"<strong>未推送的提交会被单独声明<\/strong>，因为它们传不过去——新会话在别处 clone 只会拿到远程有的东西。判定用 <code>rev-list --count HEAD --not --remotes<\/code> 而不是 <code>@{u}..HEAD<\/code>：后者依赖远程跟踪引用是否新鲜，FETCH_HEAD 陈旧时会偏小。实测某仓库 <code>ahead<\/code> 显示 0，而它的 HEAD 在任何远程上都不存在。","s4.step4.p":"扫描列出本机会话后，勾选与这个仓库相关的那些。它们<strong>自己写下的交接摘要<\/strong>会写进交接文档的「前序会话」一节，开场提示词点名它们的话题、会话 ID 与转录路径，并要求新会话把这些结论当作既有事实，不要重新推导。摘要来自 Codex 上下文压缩时留下的记录与 Claude Code 的话题标题，属于原始记录，不是本工具的推断。","s4.step4.h":"第 4 步 · 传承前序会话","s5.h":"它凭什么判断「做完了」","s5.p1":"两类证据，都能被独立复核：","s5.e1.h":"文件存在性","s5.e1.p":"计划文档的 <code>**Files:**<\/code> 段列出每个任务应产出哪些文件，直接查磁盘。","s5.e2.h":"符号定义","s5.e2.p":"<code>**Interfaces:**<\/code> 段列出应产出哪些符号，用一条合成正则一次扫完全库 —— 不是「文件里出现过这个词」，而是「这个词真的跟在 def／class／function／const 后面」。","s5.p2":"文件在但符号没定义 = 部分完成，不勾。这一条挡住了最常见的假完成：文件被创建了但里面是空的，或者只有一句 <code>pass<\/code>。","s5.diagram.title":"判定流程","s6.h":"它会自己拦住并发写入","s6.p1":"两个会话同时写一个工作树是<strong>唯一真能丢工作<\/strong>的失败模式：我们的 <code>git add<\/code> 盖掉对方暂存的内容，或者对方的 <code>commit --amend<\/code> 重写我们刚做的提交。","s6.block.h":"阻断信号 —— 默认停止，退出码 3","s6.block.p":"这些只可能由另一个进程造成：","s6.block.li1":"暂存区已有文件，而不是本次操作放进去的","s6.block.li2":"<code>index.lock<\/code> 存在 —— git 正在写索引","s6.block.li3":"<code>MERGE_HEAD<\/code> / <code>rebase-merge<\/code> / <code>CHERRY_PICK_HEAD<\/code> 存在","s6.warn.h":"提示信号 —— 继续，但记录进交接文件","s6.warn.p":"两分钟内有 git 跟踪的文件被改动。最常见的成因是<strong>你自己<\/strong>刚改完就来跑交接。","s6.why.h":"为什么要分级","s6.why.p":"把「刚改完」当阻断，会逼你每次都加 <code>--force<\/code>；而 <code>--force<\/code> 会连真正的阻断信号一起放过，反而更危险。分级之后 <code>--force<\/code> 变成真正的例外手段。","s6.after.h":"跑完还会再查一次","s6.after.p":"运行期间如果 HEAD 被<strong>别人的<\/strong>提交推进了，说明第二个会话在跟你赛跑，提示词里那个 HEAD 已经过期。工具会明确警告并建议重跑。我们自己的两个提交是预期的，不会误报 —— 三种语言的提交主题都被认得，切过语言也不会误判。","s6.diagram.title":"并发保护流程","s7.h":"提示词里有什么，为什么","s7.p1":"六块内容，缺任何一块都会让接续会话走错路：","s7.b1.h":"现场坐标","s7.b1.p":"仓库路径、分支、HEAD。缺了它不知道自己在哪。","s7.b2.h":"先读计划文档，并点名意图段落","s7.b2.p":"不只说「去看计划」，而是点名 Goal／Constraints／Architecture 这几段。缺了它把计划当待办清单，漏掉红线。","s7.b3.h":"已完成任务的名字","s7.b3.p":"「不要重做 Task 1 / Task 3」。只给一个数字（「已完成 12 步」）没用 —— 它不知道哪 12 步。","s7.b4.h":"具体缺口","s7.b4.p":"缺哪个文件、缺哪个符号。缺了它要从头找。","s7.b5.h":"过期声明","s7.b5.p":"生成时间 + 对应 HEAD。缺了它旧提示词会被复用，指向一个已经不存在的状态。","s7.b6.h":"前序会话的结论","s7.b6.p":"勾选过的会话，它们自己写下的压缩摘要与用户原话都进交接文档，提示词点名它们。缺了它，新会话会把上一个会话已经排除的方案重新试一遍。","s7.diagram.title":"提示词六块结构，以及每块缺失的后果","s8.h":"提示词会过期，别复用旧的","s8.p1":"提示词末尾带生成时间和 HEAD。仓库此后又有提交时，那段提示词描述的现场已经不对了 —— 它说的「优先级」和「缺口」可能已经被解决，它引用的 HEAD 可能已经被 rebase 掉。","s8.p2":"重跑一次，几秒钟的事。复用旧提示词的代价是新会话按过时的地图行动。","s9.h":"计划文档长什么样","s9.p1":"自动探测：深度 5 以内、含任务标题且至少 3 个复选框的最新 markdown。也可以用 <code>--plan<\/code> 明确指定。","s9.p2":"Task 1 的两个文件都存在、两个符号都真被定义，两个 Step 才会被勾上。","s10.h":"参数表","s10.t.flag":"参数","s10.t.what":"作用","s10.exit.h":"退出码","s10.exit.0":"成功","s10.exit.1":"没有会话匹配 <code>--find<\/code> 的关键词","s10.exit.2":"参数或环境错误（路径不存在、不是 git 仓库、找不到 git）","s10.exit.3":"检测到并发写入而停止，未做任何改动","s11.h":"三条设计约束","s11.c1.h":"不硬编码","s11.c1.p":"项目名、路径、任务名、测试命令一律从仓库自身推断。换一个项目不用改一行代码。","s11.c2.h":"失败不中断","s11.c2.p":"某个环节失败（没有 ripgrep、测试超时、子模块读不到）就降级，把已经拿到的信息写出来，不让整次交接空手而归。","s11.c3.h":"提示词要短","s11.c3.p":"提示词是要粘进新会话的，它自己就在消耗上下文。长的东西写进交接文件，让智能体自己去读。","s12.h":"一个做不到的情况","s12.p":"项目里没有计划文档时，<strong>原始意图无法传递<\/strong>。文件存在性和符号定义能说明「做到哪一步」，但说不出「本来要做什么」。这时工具会明确提醒你手工补一句目标。这不是 bug，是信息本身不存在。","s13.h":"文件夹里都有什么","s13.t.path":"路径","s13.t.what":"是什么"},"zh-Hant":{"lang":"zh-Hant","dir_note":"繁體中文","title":"工作階段交接工具 · 圖文說明","tagline":"工作階段卡死時，把進度從對話裡搬進儲存庫","eyebrow":"本機實測 · 54 個 Claude + 54 個 Codex 記錄","gauge.axis":"記錄體積區間","gauge.metric":"該區間出現過致命錯誤的比例","gauge.foot":"分檔不是拍腦袋，但它只是墊底判據。真正的判定看上下文佔用，那個數字直接從記錄裡讀出來（Claude 記在 message.usage，Codex 的 token_count 事件還帶模型上限）；只有記錄裡讀不到 token 數才退回體積。體積與真實佔用嚴重脫鉤：實測一個 1.0 MB 的工作階段已用 194,183 token，一個 2.0 MB 的工作階段已經壓縮過 10 次。頁面後面每一個徽章、每一條色邊都取自這四檔，顏色本身攜帶嚴重度。","nav":"目錄","s1.h":"工作階段死了，什麼跟著死","s1.p1":"程式碼不會死。程式碼在磁碟上，git 裡也有。死掉的是<strong>只存在於那段對話裡的東西<\/strong>：","s1.li1":"目標 —— 你到底要做成什麼樣","s1.li2":"已經排除的方案 —— 試過、不行、別再試","s1.li3":"紅線 —— 哪個檔案絕對不能動","s1.li4":"下一步 —— 上一個工作階段正打算做什麼","s1.p2":"新工作階段拿不到這些，於是它重做已完成的工作，或者改掉你明確說過不能動的檔案。這個工具把這四樣東西固化成儲存庫裡的檔案，讓新工作階段自己讀。","sn.h":"先讀這一節：什麼時候不該用它","sn.p1":"同一個 APP、同一台機器、同一個供應商、上下文沒滿、工作階段檔案完好時——<strong>用原生續接，不要用這個工具<\/strong>。","sn.p2":"原生續接恢復的是<strong>完整對話歷史<\/strong>（Claude Code 官方文件：「the full history, including tool calls and results」），即原樣重播 token，<strong>無損<\/strong>。本工具產出的是<strong>有損摘要<\/strong>，不可能等於無損重播。它的價值只在原生續接<strong>結構性做不到<\/strong>的七類場景：","sn.t.case":"場景","sn.t.why":"為什麼原生做不到","sn.c1.a":"上下文已耗盡","sn.c1.b":"官方自己的解法也是壓縮摘要——閒置 1 小時 + 超 10 萬 token 時彈「Resume from summary」，等於跑 <code>/compact<\/code>","sn.c2.a":"跨 APP：Claude Code ↔ Codex","sn.c2.b":"兩邊格式與事件語意完全不同，<strong>無任何官方匯入機制<\/strong>","sn.c3.a":"換模型 / 換供應商","sn.c3.b":"文件明列：模型在已退役、被 <code>--model<\/code> 覆蓋、或 Bedrock 等部署 ID 供應商上<strong>不恢復<\/strong>","sn.c4.a":"工作階段檔案損壞","sn.c4.b":"<code>Failed to resume the conversation<\/code>，退出碼 1","sn.c5.a":"要丟棄被污染的歷史","sn.c5.b":"原生只能全帶或摘要；<code>/branch<\/code> 是複製而非裁剪","sn.c6.a":"跨機器","sn.c6.b":"轉錄可以拷，但官方按 ID 查找只在「恰好一個專案持有該 ID」時才解析，手工副本會被判 not-found","sn.c7.a":"plan mode / 背景任務 / MCP / CLI 啟動參數","sn.c7.b":"文件明列<strong>永不恢復<\/strong>——寫進交接文件反而更可靠","sn.h2":"哪些東西原理上傳不過去","sn.p3":"工具會把這一段寫進產生的提示詞，免得接續工作階段把「摘要裡沒有」當成「沒發生過」，於是把上一個工作階段已經排除的方案重新試一遍。","sn.x1":"模型內部推理狀態與 prompt 快取——<code>encrypted_content<\/code> 是伺服器端加密字串，換工作階段即失效","sn.x2":"工具授權執行時狀態——新工作階段會重新彈權限確認","sn.x3":"MCP 連線與認證權杖——轉錄只記工具<strong>名字<\/strong>，不記連線","sn.x4":"背景行程、監聽埠、已啟動的服務——「服務已啟動」的假設會失效","sn.x5":"被否決方案的推理過程——thinking 無簽章不可重播，且多在子代理轉錄裡（實測子代理「過程 : 報告」= <strong>124 : 1<\/strong>，14.6 MB 過程 vs 118 KB 報告）","s2.h":"什麼時候該跑它","s2.p1":"三個觸發點，任何一個出現就跑：","s2.li1":"對話開始變慢、工具呼叫頻繁失敗、上游回傳 400 或熔斷提示","s2.li2":"你已經在想「要不要重開一個工作階段」","s2.li3":"健檢結果顯示某個工作階段進了「立即交接」區間","s2.h2":"54 + 54 個工作階段實際怎麼結束的","s2.p0":"<strong>判定看上下文佔用，不是檔案體積。<\/strong> 佔用數就寫在記錄裡：Claude 記在 <code>message.usage<\/code>，Codex 的 <code>token_count<\/code> 事件還額外帶 <code>model_context_window<\/code>——所以 Codex 側能算出真佔用率，Claude 側則拿佔用量對照按 200k 視窗折算的閾值。已經壓縮過的工作階段直接按「滿過」對待：自動壓縮只在上下文裝不下時才觸發，而每次壓縮都會丟掉更早的歷史，所以壓縮一次即「盡快交接」，兩次以上「立即交接」。","s2.p0b":"本機實測四個記錄說明體積替代不了佔用：1.0 MB / 194,183 token（體積會判<em>健康<\/em>）、2.0 MB / 壓縮 10 次（體積會判<em>留意<\/em>）、27.4 MB / 710,340 token，以及一個 Codex 工作階段 121,407 / 121,600 token——佔用 99.8%，而體積只會說<em>盡快交接<\/em>。第二個最能說明問題：它體積小<em>恰恰因為<\/em>壓縮一直在丟歷史。","s2.p2":"下面這套體積分檔是讀不到 token 數時的墊底。它也不是拍腦袋，是本機 54 個 Claude 記錄 + 54 個 Codex 記錄的實測分佈：","s2.t.size":"記錄體積","s2.t.verdict":"判定","s2.t.measured":"實測","s2.r1":"該區間 100% 出現過致命錯誤","s2.r2":"約三成出現過","s2.r3":"約一成七出現過","s2.r4":"250 KB 以下無一出現過","s2.p3":"「致命錯誤」指真的殺死過工作階段的簽章：content-blocked、供應商熔斷、無可用管道、圖片尺寸超限。只讓人煩躁的錯誤不算。","s2.p4":"另外單獨統計<strong>被打斷的輪次<\/strong>（<code>turn_aborted<\/code>）。實測 Codex 側 <code>is_error<\/code> 在 40 個轉錄裡只有 3 次，而 <code>turn_aborted<\/code> 有 6 次——後者才是「這輪沒做完」的真實訊號，而把半成品當成已完成是交接裡最貴的誤判。致命錯誤與中斷回答的是「已經出事了沒有」，跟「還能撐多久」是兩件事；任何一個都會把工作階段往上抬一檔。","s3.h":"怎麼用","s3.p1":"三種入口，功能等同，選順手的：","s3.gui.h":"網頁介面","s3.gui.p":"最好看，支援简体／繁體／English 隨時切換，淺色深色跟隨系統。服務只繫結本機回環位址，每個請求都要一次性權杖 —— 它能對任意路徑跑 git commit，所以這不是可選項。","s3.menu.h":"互動選單","s3.menu.p":"不用記參數。Windows 雙擊 <code>雙擊執行.cmd<\/code>，Linux／macOS 跑 <code>./scripts/run.sh<\/code>。把專案資料夾拖進視窗就能填路徑。","s3.cli.h":"命令列","s3.cli.p":"適合寫進腳本。加 <code>--json<\/code> 可以讓輸出被程式取用。","s4.h":"四步做了什麼","s4.step1.h":"第 1 步 · 提交快照","s4.step1.p":"把工作區的一切提交，但<strong>排除計畫文件宣告為「使用者私有」的檔案<\/strong>。識別方式：計畫文件裡寫了「`docs/LOGO.jpg` 是使用者私有檔案，不得提交」這類句子，路徑會被自動加進排除清單。","s4.step1.note":"排除用的是 git 的 <code>:(exclude,literal)<\/code> 長寫法而不是 <code>:!path<\/code> 簡寫：後者在舊版 git 上不支援，且路徑含 <code>[<\/code> 或 <code>*<\/code> 時會被當通用字元，排除會靜默失效 —— 私有檔案就被提交上去了。","s4.step2.h":"第 2 步 · 回填計畫","s4.step2.p":"依<strong>客觀證據<\/strong>勾選核取方塊，不看任何人的自我報告。一個任務的全部檔案都存在、全部符號都真的被 <code>def<\/code>／<code>class<\/code>／<code>function<\/code> 定義了，它的每一步才會被勾上。","s4.step3.h":"第 3 步 · 產生交接","s4.step3.p":"寫出一份交接 Markdown（現場、完成度、缺口、測試結果、環境陷阱）和一段可直接貼上的開場提示詞。","s4.step4.note":"提示詞裡只放話題、會話 ID 與轉錄路徑，完整摘要留在交接文件裡——兩份多 MB 的轉錄合計上百萬字元，任何提示詞都裝不下。命令列用 <code>--pick-sessions<\/code> 勾選，或 <code>--sessions PATH<\/code> 直接指定。","sc.h":"傳承工作階段時，實測丟了多少","sc.p1":"Codex 在上下文將滿時會自己寫一份壓縮摘要（<code>compacted<\/code> 事件）。一個工作階段可以壓縮很多次——本機實測 70 個帶壓縮的轉錄裡 52 個是多視窗，最多 <strong>19 個視窗<\/strong>。關鍵問題是：後一個視窗有沒有包含前一個？","sc.p2":"<strong>不包含。<\/strong> <code>window_number<\/code> 遞增、<code>previous_window_id<\/code> 串成鏈，每個視窗只總結它自己那一段，<strong>沒有任何一個樣本<\/strong>的末視窗逐字包含首視窗。所以「只保留最後一次摘要」這個看起來合理的做法，實際會丟掉：","sc.m1.k":"中位 78%","sc.m1.v":"具體事實（commit sha、檔案路徑、測試計數）在只留末視窗時消失；p90 是 96%","sc.m2.k":"11 個轉錄","sc.m2.v":"的「使用者目標 / 紅線約束」<strong>只出現在早期視窗<\/strong>——恰恰是最不能丟的那部分","sc.m3.k":"62 / 70","sc.m3.v":"個末視窗超過 4000 字元。截斷到那個長度會中位切掉 2925 字元、最多 13241 字元，而切掉的往往正是結論與待辦","sc.p3":"所以這個工具<strong>保留全部視窗<\/strong>並按時間順序拼接，也<strong>不截斷<\/strong>。修復後實測丟失率 <strong>0%<\/strong>（70/70）。視窗之間加分隔標題——多個視窗各自都有「當前進度」，不分隔會互相矛盾。","sc.p4":"摘要是模型的<em>轉述<\/em>，轉述會丟措辭裡的約束。所以工具還從 <code>replacement_history<\/code> 裡取出<strong>使用者原話<\/strong>逐字保留——實測某個轉錄裡「將專案 B 推送到 GitHub 並建立 tag」只存在於這裡，任何摘要都沒有逐字留下它。交接文件把原話單獨成節，並註明它優先於任何轉述。","si.h":"儲存庫身分，不是本機路徑","si.p1":"提示詞同時給兩樣東西：本機路徑，以及 <strong>remote URL + 完整 40 位 sha<\/strong>。路徑只是「它在這台機器上的位置」——新工作階段在另一台機器、容器、WSL 或 Codespaces 裡打開時路徑不存在；而同一個 remote 下的兩個工作副本（<code>proj-a5<\/code> 與 <code>proj-b8<\/code>）也只能靠路徑區分。沒有遠端時工具會明說「只存在於本機，接續必須在同一台機器上」。","si.p2":"<strong>未推送的提交會被單獨宣告<\/strong>，因為它們傳不過去——新工作階段在別處 clone 只會拿到遠端有的東西。判定用 <code>rev-list --count HEAD --not --remotes<\/code> 而不是 <code>@{u}..HEAD<\/code>：後者依賴遠端追蹤參考是否新鮮，FETCH_HEAD 陳舊時會偏小。實測某儲存庫 <code>ahead<\/code> 顯示 0，而它的 HEAD 在任何遠端上都不存在。","s4.step4.p":"掃描列出本機會話後，勾選與這個倉庫相關的那些。它們<strong>自己寫下的交接摘要<\/strong>會寫進交接文件的「前序會話」一節，開場提示詞點名它們的話題、會話 ID 與轉錄路徑，並要求新會話把這些結論當作既有事實，不要重新推導。摘要來自 Codex 上下文壓縮時留下的記錄與 Claude Code 的話題標題，屬於原始記錄，不是本工具的推斷。","s4.step4.h":"第 4 步 · 傳承前序會話","s5.h":"它憑什麼判斷「做完了」","s5.p1":"兩類證據，都能被獨立複核：","s5.e1.h":"檔案存在性","s5.e1.p":"計畫文件的 <code>**Files:**<\/code> 段列出每個任務應產出哪些檔案，直接查磁碟。","s5.e2.h":"符號定義","s5.e2.p":"<code>**Interfaces:**<\/code> 段列出應產出哪些符號，用一條合成正規表示式一次掃完全庫 —— 不是「檔案裡出現過這個詞」，而是「這個詞真的跟在 def／class／function／const 後面」。","s5.p2":"檔案在但符號沒定義 = 部分完成，不勾。這一條擋住了最常見的假完成：檔案被建立了但裡面是空的，或者只有一句 <code>pass<\/code>。","s5.diagram.title":"判定流程","s6.h":"它會自己攔住並行寫入","s6.p1":"兩個工作階段同時寫一個工作樹是<strong>唯一真能遺失工作<\/strong>的失敗模式：我們的 <code>git add<\/code> 覆蓋對方暫存的內容，或者對方的 <code>commit --amend<\/code> 重寫我們剛做的提交。","s6.block.h":"阻斷訊號 —— 預設停止，結束碼 3","s6.block.p":"這些只可能由另一個行程造成：","s6.block.li1":"暫存區已有檔案，而不是本次操作放進去的","s6.block.li2":"<code>index.lock<\/code> 存在 —— git 正在寫索引","s6.block.li3":"<code>MERGE_HEAD<\/code> / <code>rebase-merge<\/code> / <code>CHERRY_PICK_HEAD<\/code> 存在","s6.warn.h":"提示訊號 —— 繼續，但記錄進交接檔案","s6.warn.p":"兩分鐘內有 git 追蹤的檔案被變更。最常見的成因是<strong>你自己<\/strong>剛改完就來跑交接。","s6.why.h":"為什麼要分級","s6.why.p":"把「剛改完」當阻斷，會逼你每次都加 <code>--force<\/code>；而 <code>--force<\/code> 會連真正的阻斷訊號一起放過，反而更危險。分級之後 <code>--force<\/code> 變成真正的例外手段。","s6.after.h":"跑完還會再查一次","s6.after.p":"執行期間如果 HEAD 被<strong>別人的<\/strong>提交推進了，說明第二個工作階段在跟你賽跑，提示詞裡那個 HEAD 已經過期。工具會明確警告並建議重跑。我們自己的兩個提交是預期的，不會誤報 —— 三種語言的提交主題都被認得，切過語言也不會誤判。","s6.diagram.title":"並行保護流程","s7.h":"提示詞裡有什麼，為什麼","s7.p1":"六塊內容，缺任何一塊都會讓接續工作階段走錯路：","s7.b1.h":"現場座標","s7.b1.p":"儲存庫路徑、分支、HEAD。缺了它不知道自己在哪。","s7.b2.h":"先讀計畫文件，並點名意圖段落","s7.b2.p":"不只說「去看計畫」，而是點名 Goal／Constraints／Architecture 這幾段。缺了它把計畫當待辦清單，漏掉紅線。","s7.b3.h":"已完成任務的名字","s7.b3.p":"「不要重做 Task 1 / Task 3」。只給一個數字（「已完成 12 步」）沒用 —— 它不知道哪 12 步。","s7.b4.h":"具體缺口","s7.b4.p":"缺哪個檔案、缺哪個符號。缺了它要從頭找。","s7.b5.h":"過期宣告","s7.b5.p":"產生時間 + 對應 HEAD。缺了它舊提示詞會被重複使用，指向一個已經不存在的狀態。","s7.b6.h":"前序工作階段的結論","s7.b6.p":"勾選過的工作階段，它們自己寫下的壓縮摘要與使用者原話都進交接文件，提示詞點名它們。缺了它，新工作階段會把上一個工作階段已經排除的方案重新試一遍。","s7.diagram.title":"提示詞六塊結構，以及每塊缺失的後果","s8.h":"提示詞會過期，別重複使用舊的","s8.p1":"提示詞末尾帶產生時間和 HEAD。儲存庫此後又有提交時，那段提示詞描述的現場已經不對了 —— 它說的「優先順序」和「缺口」可能已經被解決，它引用的 HEAD 可能已經被 rebase 掉。","s8.p2":"重跑一次，幾秒鐘的事。重複使用舊提示詞的代價是新工作階段依過時的地圖行動。","s9.h":"計畫文件長什麼樣","s9.p1":"自動探測：深度 5 以內、含任務標題且至少 3 個核取方塊的最新 markdown。也可以用 <code>--plan<\/code> 明確指定。","s9.p2":"Task 1 的兩個檔案都存在、兩個符號都真被定義，兩個 Step 才會被勾上。","s10.h":"參數表","s10.t.flag":"參數","s10.t.what":"作用","s10.exit.h":"結束碼","s10.exit.0":"成功","s10.exit.1":"沒有工作階段符合 <code>--find<\/code> 的關鍵字","s10.exit.2":"參數或環境錯誤（路徑不存在、不是 git 儲存庫、找不到 git）","s10.exit.3":"偵測到並行寫入而停止，未做任何變更","s11.h":"三條設計約束","s11.c1.h":"不硬編碼","s11.c1.p":"專案名、路徑、任務名、測試命令一律從儲存庫自身推斷。換一個專案不用改一行程式碼。","s11.c2.h":"失敗不中斷","s11.c2.p":"某個環節失敗（沒有 ripgrep、測試逾時、子模組讀不到）就降級，把已經拿到的資訊寫出來，不讓整次交接空手而歸。","s11.c3.h":"提示詞要短","s11.c3.p":"提示詞是要貼進新工作階段的，它自己就在消耗上下文。長的東西寫進交接檔案，讓智慧代理自己去讀。","s12.h":"一個做不到的情況","s12.p":"專案裡沒有計畫文件時，<strong>原始意圖無法傳遞<\/strong>。檔案存在性和符號定義能說明「做到哪一步」，但說不出「本來要做什麼」。這時工具會明確提醒你手動補一句目標。這不是 bug，是資訊本身不存在。","s13.h":"資料夾裡都有什麼","s13.t.path":"路徑","s13.t.what":"是什麼"},"en":{"lang":"en","dir_note":"English","title":"Session Salvage · Illustrated guide","tagline":"When a session dies, move the progress out of the chat and into the repository","eyebrow":"Measured locally · 54 Claude + 54 Codex transcripts","gauge.axis":"Transcript size band","gauge.metric":"Share that hit a fatal error","gauge.foot":"These bands are observed, not guessed - but they are only the fallback. The verdict is based on real context usage read out of the transcript (Claude records message.usage; Codex records a token_count event that also carries the model's limit); size is used only when a transcript records no token counts. Size and real usage come apart badly: a 1.0 MB session measured 194,183 tokens, and a 2.0 MB one had already compacted 10 times. Every badge and coloured edge below is drawn from these four bands, so the colour itself carries severity.","nav":"Contents","s1.h":"When a session dies, what dies with it","s1.p1":"The code does not die. The code is on disk, and in git. What dies is <strong>everything that only existed inside that conversation<\/strong>:","s1.li1":"The goal — what you were actually trying to build","s1.li2":"The ruled-out approaches — tried it, does not work, do not try again","s1.li3":"The hard limits — which file must never be touched","s1.li4":"The next step — what the last session was about to do","s1.p2":"A fresh session gets none of it, so it redoes finished work, or edits the very file you said never to touch. This tool freezes those four things into files in the repository and lets the new session read them itself.","sn.h":"Read this first: when NOT to use it","sn.p1":"Same app, same machine, same provider, context not exhausted, session file intact — <strong>use native resume, not this tool<\/strong>.","sn.p2":"Native resume restores the <strong>full conversation history<\/strong> (Claude Code's own docs: “the full history, including tool calls and results”) — the tokens are replayed verbatim, <strong>losslessly<\/strong>. This tool produces a <strong>lossy digest<\/strong>, which cannot equal a lossless replay. Its value is confined to the seven cases native resume <strong>structurally cannot<\/strong> cover:","sn.t.case":"Case","sn.t.why":"Why native cannot","sn.c1.a":"Context exhausted","sn.c1.b":"The official answer is a digest too — idle for an hour past 100k tokens and it offers “Resume from summary”, i.e. it runs <code>/compact<\/code>","sn.c2.a":"Across apps: Claude Code ↔ Codex","sn.c2.b":"The formats and event semantics differ entirely; <strong>there is no official import path at all<\/strong>","sn.c3.a":"Different model or provider","sn.c3.b":"Documented: the model is <strong>not restored<\/strong> when it is retired, overridden by <code>--model<\/code>, or on deployment-id providers such as Bedrock","sn.c4.a":"Corrupt session file","sn.c4.b":"<code>Failed to resume the conversation<\/code>, exit code 1","sn.c5.a":"Discard a poisoned history","sn.c5.b":"Native offers all-or-digest; <code>/branch<\/code> copies rather than trims","sn.c6.a":"Another machine","sn.c6.b":"You can copy the transcript, but lookup by id resolves only when exactly one project holds it — a hand-made copy comes back not-found","sn.c7.a":"plan mode / background tasks / MCP / CLI startup flags","sn.c7.b":"Documented as <strong>never restored<\/strong> — writing them into the handoff is actually more reliable","sn.h2":"What cannot travel, even in principle","sn.p3":"The tool writes this into the prompt it generates, so the next session does not read “absent from the digest” as “never happened” and retry an approach the previous session already ruled out.","sn.x1":"The model's internal reasoning state and prompt cache — <code>encrypted_content<\/code> is a server-side blob, void in a new session","sn.x2":"Live tool approvals — the new session will ask for permission again","sn.x3":"MCP connections and their tokens — the transcript records tool <strong>names<\/strong>, not connections","sn.x4":"Background processes, bound ports, running services — any “the server is already up” assumption breaks","sn.x5":"The reasoning behind rejected approaches — thinking blocks are unsigned and cannot be replayed, and most of it lives in subagent transcripts (measured process-to-report ratio <strong>124 : 1<\/strong>: 14.6 MB of process, 118 KB of report)","s2.h":"When to run it","s2.p1":"Three triggers — run it if any one appears:","s2.li1":"The conversation slows down, tool calls start failing, upstream returns 400 or a provider cutoff notice","s2.li2":"You are already wondering whether to start a new session","s2.li3":"The vitals check puts a session in the \"hand off now\" band","s2.h2":"How 54 + 54 sessions actually ended","s2.p0":"<strong>The verdict is context fullness, not file size.<\/strong> The token counts are written in the transcript itself: Claude records <code>message.usage<\/code>, Codex records a <code>token_count<\/code> event that also carries <code>model_context_window<\/code> — so with Codex the real percentage is computable, and with Claude the usage figure is compared against thresholds scaled for a 200k window. A session that has already compacted is treated as having hit the limit, because automatic compaction only fires when the context can no longer fit; each one drops older history, so one compaction reads as \"hand off soon\" and two or more as \"hand off now\".","s2.p0b":"Four transcripts measured on one machine show why size cannot stand in for usage: 1.0 MB / 194,183 tokens (size would say <em>healthy<\/em>), 2.0 MB / 10 compactions (size would say <em>watch<\/em>), 27.4 MB / 710,340 tokens, and a Codex session at 121,407 of 121,600 tokens — 99.8% full — that size would call merely <em>hand off soon<\/em>. The second one is the point: it is small <em>because<\/em> compaction kept discarding history.","s2.p2":"The size bands below are the fallback for transcripts that record no token counts. They are not guesses either — they come from the measured distribution of 54 Claude transcripts and 54 Codex transcripts on one machine:","s2.t.size":"Transcript size","s2.t.verdict":"Verdict","s2.t.measured":"Measured","s2.r1":"100% of this band hit a fatal error","s2.r2":"About a third did","s2.r3":"About 17% did","s2.r4":"Nothing under 250 KB did","s2.p3":"\"Fatal error\" means a signature that actually killed a session: content-blocked, provider cutoff, no available channel, image dimension exceeded. Errors that were merely annoying do not count.","s2.p4":"<strong>Aborted turns<\/strong> (<code>turn_aborted<\/code>) are counted separately. Measured on the Codex side: <code>is_error<\/code> appears 3 times across 40 transcripts, while <code>turn_aborted<\/code> appears 6 — the latter is the real signal for “this turn never finished”, and mistaking half-done work for finished work is the most expensive error a handoff can make. Fatal errors and aborted turns answer “has it already gone wrong”, which is a different question from “how much room is left”; either one bumps a session up a band.","s3.h":"How to run it","s3.p1":"Three entry points, equivalent features. Pick whichever fits your hands:","s3.gui.h":"Web interface","s3.gui.p":"The best looking one. Switch between simplified Chinese, traditional Chinese, and English at any time; light and dark follow the system. The server binds the loopback address only and every request needs a one-shot token — it can run git commit against an arbitrary path, so that is not optional.","s3.menu.h":"Interactive menu","s3.menu.p":"No flags to remember. Double-click <code>双击运行.cmd<\/code> on Windows, run <code>./scripts/run.sh<\/code> on Linux and macOS. Drag the project folder into the window to fill the path.","s3.cli.h":"Command line","s3.cli.p":"Best for scripts. Add <code>--json<\/code> to make the output machine-consumable.","s4.h":"What the four steps do","s4.step1.h":"Step 1 · Commit snapshot","s4.step1.p":"Commits everything in the worktree, <strong>except files the plan document declares user-owned<\/strong>. How it recognizes them: the plan says something like \"`docs/LOGO.jpg` is a user-owned file and must not be committed\", and that path is added to the exclusion list automatically.","s4.step1.note":"The exclusion uses git's long <code>:(exclude,literal)<\/code> form rather than the <code>:!path<\/code> shorthand. The shorthand is unsupported on older git, and when the path contains <code>[<\/code> or <code>*<\/code> it is treated as a glob, so the exclusion silently fails — and the private file gets committed.","s4.step2.h":"Step 2 · Backfill the plan","s4.step2.p":"Ticks checkboxes from <strong>objective evidence<\/strong>, never from anyone's self-report. Only when every file of a task exists and every symbol is genuinely defined by a <code>def<\/code> / <code>class<\/code> / <code>function<\/code> does it tick that task's steps.","s4.step3.h":"Step 3 · Write the handoff","s4.step3.p":"Produces a handoff Markdown (state, completion, gaps, test results, environment traps) and an opening prompt you can paste straight in.","s4.step4.note":"The prompt carries only topic, session id and transcript path; full digests stay in the handoff file - two multi-MB transcripts run to a million characters, which no prompt can hold. Use <code>--pick-sessions<\/code> to tick interactively, or <code>--sessions PATH<\/code> to name them directly.","sc.h":"Carrying a session over: what actually gets lost","sc.p1":"When context fills up, Codex writes its own digest (a <code>compacted<\/code> event). A session can compact many times — of 70 local transcripts that carry compaction, 52 are multi-window, the largest with <strong>19 windows<\/strong>. The question that matters: does a later window contain the earlier ones?","sc.p2":"<strong>It does not.<\/strong> <code>window_number<\/code> increments and <code>previous_window_id<\/code> chains them, but each window summarises only its own stretch — in <strong>no sample<\/strong> does the last window contain the first verbatim. So the plausible-looking shortcut of “keep only the newest digest” actually discards:","sc.m1.k":"median 78%","sc.m1.v":"of the concrete facts (commit shas, file paths, test counts) vanish if only the last window is kept; the p90 is 96%","sc.m2.k":"11 transcripts","sc.m2.v":"carry their “user goal / hard limits” <strong>only in an early window<\/strong> — exactly the part that must not be lost","sc.m3.k":"62 of 70","sc.m3.v":"last windows exceed 4000 characters. Truncating there cuts a median of 2925 characters and up to 13241 — and what gets cut is usually the conclusions and the to-dos","sc.p3":"So this tool <strong>keeps every window<\/strong>, joined in order, and <strong>never truncates<\/strong>. Measured loss after the fix: <strong>0%<\/strong> (70/70). The windows get separator headings — each one has its own “current progress”, and without separators they read as contradicting each other.","sc.p4":"A digest is the model's <em>paraphrase<\/em>, and paraphrase drops the constraints that lived in the wording. So the tool also lifts your <strong>verbatim asks<\/strong> out of <code>replacement_history<\/code> — in one measured transcript “push project B to GitHub and create a tag” exists only there; no digest kept it word for word. The handoff gives them their own section, marked as outranking any paraphrase.","si.h":"Repo identity, not a local path","si.p1":"The prompt carries both: the local path, and the <strong>remote URL plus the full 40-character sha<\/strong>. A path is only “where it sits on this machine” — it does not exist when the next session opens on another machine, in a container, under WSL or in Codespaces; and two working copies of the same remote (<code>proj-a5<\/code> vs <code>proj-b8<\/code>) can only be told apart by path. With no remote at all, the tool says so plainly: this exists only here, continue on this machine.","si.p2":"<strong>Unpushed commits get called out separately<\/strong>, because they cannot travel — a fresh clone elsewhere only gets what the remote has. The count comes from <code>rev-list --count HEAD --not --remotes<\/code> rather than <code>@{u}..HEAD<\/code>: the latter depends on how fresh the remote-tracking ref is and reads low when FETCH_HEAD is stale. Measured: one repo reported <code>ahead<\/code> 0 while its HEAD existed on no remote at all.","s4.step4.p":"After the scan lists your sessions, tick the ones related to this repo. The digest <strong>each session wrote itself<\/strong> goes into the handoff document, and the opening prompt names their topic, session id and transcript path, telling the next session to treat those conclusions as established facts rather than re-deriving them. Digests come from Codex compaction records and Claude Code topic titles - primary records, not this tool inferring anything.","s4.step4.h":"Step 4 - Carry over prior sessions","s5.h":"How it decides something is done","s5.p1":"Two kinds of evidence, both independently checkable:","s5.e1.h":"File existence","s5.e1.p":"The plan's <code>**Files:**<\/code> block lists which files each task should produce; it checks the disk directly.","s5.e2.h":"Symbol definition","s5.e2.p":"The <code>**Interfaces:**<\/code> block lists which symbols should exist, and one composed regex sweeps the whole repository in a single pass — not \"the word appears in a file\" but \"the word actually follows def / class / function / const\".","s5.p2":"File present but symbol undefined means partial — no tick. That single rule catches the most common false completion: the file was created but it is empty, or it holds one <code>pass<\/code>.","s5.diagram.title":"Verdict flow","s6.h":"It stops concurrent writes by itself","s6.p1":"Two sessions writing one worktree is the <strong>single failure mode that genuinely loses work<\/strong>: our <code>git add<\/code> buries what they staged, or their <code>commit --amend<\/code> rewrites the commit we just made.","s6.block.h":"Blocking signals — stop by default, exit code 3","s6.block.p":"Only another process can cause these:","s6.block.li1":"Files already staged that this run did not stage","s6.block.li2":"<code>index.lock<\/code> present — git is writing the index","s6.block.li3":"<code>MERGE_HEAD<\/code> / <code>rebase-merge<\/code> / <code>CHERRY_PICK_HEAD<\/code> present","s6.warn.h":"Advisory signals — continue, but record them in the handoff","s6.warn.p":"A git-tracked file modified within the last two minutes. The most common cause is <strong>you<\/strong>, having just finished editing and come straight here.","s6.why.h":"Why the split matters","s6.why.p":"Treating \"just edited\" as blocking would force <code>--force<\/code> on every run, and <code>--force<\/code> waves through the real blocking signals too. That is worse. With the split, <code>--force<\/code> stays a genuine exception.","s6.after.h":"It checks again afterwards","s6.after.p":"If <strong>someone else's<\/strong> commit moved HEAD while it ran, a second session is racing you and the HEAD in the prompt is already stale. The tool warns explicitly and suggests rerunning. Our own two commits are expected and never trigger it — the commit subjects are recognized in all three languages, so switching language does not cause a false alarm.","s6.diagram.title":"Concurrency protection flow","s7.h":"What is in the prompt, and why","s7.p1":"Six blocks. Missing any one of them sends the next session down the wrong path:","s7.b1.h":"Coordinates","s7.b1.p":"Repository path, branch, HEAD. Without it the agent does not know where it is.","s7.b2.h":"Read the plan first, with the intent sections named","s7.b2.p":"Not just \"go look at the plan\" but naming the Goal / Constraints / Architecture sections. Without it the plan reads as a to-do list and the hard limits get missed.","s7.b3.h":"The names of finished tasks","s7.b3.p":"\"Do not redo Task 1 / Task 3\". A bare number (\"12 steps done\") is useless — the agent does not know which 12.","s7.b4.h":"Concrete gaps","s7.b4.p":"Which file is missing, which symbol is missing. Without it the agent starts the search from scratch.","s7.b5.h":"Expiry statement","s7.b5.p":"Generation time plus the matching HEAD. Without it an old prompt gets reused, pointing at a state that no longer exists.","s7.b6.h":"What earlier sessions concluded","s7.b6.p":"For the sessions you picked, their own compaction digests and the user's verbatim asks go into the handoff document, and the prompt names them. Without it the new session retries an approach the previous one already ruled out.","s7.diagram.title":"The prompt's six blocks, and what breaks without each","s8.h":"Prompts expire — do not reuse an old one","s8.p1":"The prompt ends with its generation time and HEAD. Once the repository takes new commits, the state it describes is wrong: the \"priority\" and \"gaps\" it names may already be resolved, and the HEAD it cites may have been rebased away.","s8.p2":"Rerunning takes seconds. The cost of reusing an old prompt is a new session acting on an out-of-date map.","s9.h":"What a plan document looks like","s9.p1":"Auto-detected: the newest markdown within depth 5 that has task headings and at least three checkboxes. You can also name one with <code>--plan<\/code>.","s9.p2":"Both of Task 1's files must exist and both symbols must genuinely be defined before the two steps get ticked.","s10.h":"Flags","s10.t.flag":"Flag","s10.t.what":"What it does","s10.exit.h":"Exit codes","s10.exit.0":"Success","s10.exit.1":"No session matched the <code>--find<\/code> keyword","s10.exit.2":"Bad argument or environment (path missing, not a git repository, git not found)","s10.exit.3":"Stopped because a concurrent write was detected; nothing was changed","s11.h":"Three design constraints","s11.c1.h":"Hardcode nothing","s11.c1.p":"Project name, paths, task names, and test commands are all inferred from the repository. Point it at another project and not one line changes.","s11.c2.h":"Failure never aborts","s11.c2.p":"When a step fails — no ripgrep, a test timeout, an unreadable submodule — it degrades and writes out what it did get, rather than leaving the whole handoff empty-handed.","s11.c3.h":"The prompt stays short","s11.c3.p":"The prompt is pasted into the new session, so it consumes context by existing. Long material goes into the handoff file for the agent to read itself.","s12.h":"One thing it cannot do","s12.p":"With no plan document in the project, <strong>the original intent cannot be transmitted<\/strong>. File existence and symbol definitions can say how far the work got, but not what it was for. The tool tells you plainly to add a goal by hand. That is not a bug; the information simply is not there.","s13.h":"What is in the folder","s13.t.path":"Path","s13.t.what":"What it is"}}</script>

rectory","cli.arg.pick_sessions":"interactively pick which sessions to carry over","cli.arg.plan":"Path to the plan document; omit to auto-detect the newest checkbox-bearing task document","cli.arg.port":"Web interface port; 0 picks a free port automatically","cli.arg.repo":"Repository path; defaults to the current directory","cli.arg.sessions":"extract these transcripts' content into the handoff and prompt; repeatable","cli.arg.skip_tests":"Do not run tests (fast mode)","cli.arg.sweep":"report how much disk the transcripts use and what is safe to reclaim, then exit; never deletes anything","cli.arg.test_timeout":"Timeout in seconds per test command; default 900","cli.arg.vitals":"Only check local session transcripts and exit; never touches the repository"}}</script>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   仪表盘，不是宣传页。

   这个工具的全部说服力来自实测数字（250 KB 以下无一致命、8 MB 以上全部致命、
   只留末窗丢掉 78%），所以页面的主角是读数而不是标题：首屏第一眼看到的是
   一支按对数刻度画出的量程条，柱高就是该区间实测的失败率。

   配色不是挑好看的颜色，而是**工具自己的四档判据**：健康→留意→尽快→立刻。
   它天然是一条绿→赭→橙→红的序列色阶，量程条、徽章、边框全部取自这一条，
   于是颜色本身携带信息，换一种配色就等于改判据。

   等宽字体是主声部而非配角：工具的产物（转录、提示词、参数、阈值）全是等宽的，
   页面的数据层也就全用等宽，只有叙述用无衬线。中文必须走系统字体——这份文档
   是单文件、零外链，任何 CJK 网络字体都是几 MB 的额外失败路径。
   ─────────────────────────────────────────────────────────────────────── */
:root{
  color-scheme:light;
  /* 冷灰纸，带一点绿味；不是米白，也不是纯中性灰 */
  --bg:#EBEEEE;--bg-deep:#E0E5E5;--surface:#FFFFFF;--surface-2:#F4F7F7;
  --line:#D2DADA;--line-hard:#B6C2C2;--line-soft:#E3E9E9;
  --ink:#0E1416;--ink-2:#39474A;--ink-3:#6B7B7E;--ink-4:#94A2A4;
  /* 四档判据 = 序列色阶。顺序即严重度，不可打乱。 */
  --ok:#1F6B4F;--ok-bg:#DBEAE1;
  --watch:#7C6210;--watch-bg:#F0E7CC;
  --high:#A85219;--high-bg:#F5E1D1;
  --critical:#93261E;--crit-bg:#F3D9D5;
  /* 主色取自「健康」：工具的目的就是把你送回这一档 */
  --accent:#1F6B4F;--accent-ink:#FFFFFF;--accent-soft:#DBEAE1;
  --info:#2F5473;--info-bg:#DEE7EF;
  --sh-1:0 1px 2px rgba(14,20,22,.05);
  --sh-2:0 1px 2px rgba(14,20,22,.05),0 10px 28px rgba(14,20,22,.07);
  --r:4px;--r-md:7px;--r-lg:11px;
  --mono:ui-monospace,"Cascadia Mono","SF Mono","JetBrains Mono","DejaVu Sans Mono",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI","Noto Sans CJK SC",Roboto,Helvetica,Arial,sans-serif;
}
/* 深色不是把浅色反过来：纸张变成炭黑玻璃，四档色阶整体提亮以保住对比度，
   而顺序（绿→赭→橙→红）逐字不变——顺序携带信息，不能因为主题而重排。 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0B1012;--bg-deep:#070C0D;--surface:#131A1C;--surface-2:#1B2427;
  --line:#263134;--line-hard:#38474A;--line-soft:#1F282B;
  --ink:#E6EDEB;--ink-2:#AEBDBB;--ink-3:#7D8D8F;--ink-4:#5A6A6C;
  --ok:#5CBE93;--ok-bg:#11301F;
  --watch:#D5B054;--watch-bg:#2D2510;
  --high:#E38A50;--high-bg:#331F11;
  --critical:#E27A6E;--crit-bg:#331714;
  --accent:#5CBE93;--accent-ink:#06110B;--accent-soft:#11301F;
  --info:#8FB6D8;--info-bg:#15212C;
  --sh-1:0 1px 2px rgba(0,0,0,.55);
  --sh-2:0 1px 2px rgba(0,0,0,.55),0 12px 32px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1012;--bg-deep:#070C0D;--surface:#131A1C;--surface-2:#1B2427;
  --line:#263134;--line-hard:#38474A;--line-soft:#1F282B;
  --ink:#E6EDEB;--ink-2:#AEBDBB;--ink-3:#7D8D8F;--ink-4:#5A6A6C;
  --ok:#5CBE93;--ok-bg:#11301F;
  --watch:#D5B054;--watch-bg:#2D2510;
  --high:#E38A50;--high-bg:#331F11;
  --critical:#E27A6E;--crit-bg:#331714;
  --accent:#5CBE93;--accent-ink:#06110B;--accent-soft:#11301F;
  --info:#8FB6D8;--info-bg:#15212C;
  --sh-1:0 1px 2px rgba(0,0,0,.55);
  --sh-2:0 1px 2px rgba(0,0,0,.55),0 12px 32px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.7 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.014em}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r)}

/* 数据层一律等宽：阈值、参数、路径、会话 ID 都是可复制的字面量，
   等宽让它们在视觉上与叙述分层，读者一眼知道哪些字要照抄。 */
code,kbd{font-family:var(--mono);font-size:.86em;font-variant-ligatures:none}
code{background:var(--surface-2);padding:1.5px 5px;border-radius:var(--r);
  border:1px solid var(--line-soft);color:var(--ink)}
pre{margin:0;padding:14px 16px;background:var(--bg-deep);border:1px solid var(--line);
  border-radius:var(--r-md);overflow-x:auto;font-family:var(--mono);font-size:12.6px;line-height:1.62;
  color:var(--ink-2);tab-size:2}
pre code{background:none;border:0;padding:0;font-size:inherit;color:inherit}
svg{display:block;max-width:100%}
svg text{font-family:var(--mono)}

/* ── 顶栏 ─────────────────────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:0 22px;height:52px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(9px);border-bottom:1px solid var(--line)}
.top .mark{width:24px;height:24px;flex:none}
.top .mark rect{fill:var(--accent)}
.top .mark path{fill:var(--accent-ink)}
.top .name{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.top .ver{font:500 11px/1 var(--mono);color:var(--ink-4);padding:3px 6px;
  border:1px solid var(--line);border-radius:var(--r)}
.top .spacer{margin-left:auto}
.seg{display:flex;gap:1px;padding:2px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-md)}
.seg button{border:0;border-radius:var(--r);background:transparent;color:var(--ink-3);
  font:500 12px/1 var(--sans);padding:6px 10px;cursor:pointer;transition:color .12s,background .12s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:var(--sh-1);font-weight:650}

/* ── 首屏：量程条是主角 ────────────────────────────────────────────────
   一支按体积对数刻度排布的横条，四段宽度对应四个区间，段内数字是实测失败率。
   它同时是全文的图例：后面每一个徽章、每一条左边框都取这四色之一。 */
.hero{border-bottom:1px solid var(--line);background:
  linear-gradient(180deg,color-mix(in srgb,var(--surface) 70%,transparent),transparent)}
.hero-in{max-width:1120px;margin:0 auto;padding:52px 22px 40px}
.eyebrow{display:flex;align-items:center;gap:9px;font:600 11px/1 var(--mono);
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.hero h1{margin-top:16px;font-size:clamp(28px,4.4vw,44px);line-height:1.1;letter-spacing:-.03em;
  max-width:20ch;font-weight:700}
.hero .lede{margin-top:14px;font-size:clamp(15px,1.4vw,17.5px);line-height:1.6;
  color:var(--ink-2);max-width:52ch}

.gauge{margin-top:34px}
.gauge-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  font:500 11.5px/1 var(--mono);color:var(--ink-4);letter-spacing:.04em;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.gauge-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:14px}
.gb{position:relative;padding:13px 12px 12px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);overflow:hidden}
/* 顶部那道 4px 实色是这一档的身份色，也是全文配色的定义处 */
.gb::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.gb .pct{font:700 clamp(22px,3vw,32px)/1 var(--mono);color:var(--c);letter-spacing:-.03em}
.gb .band{margin-top:7px;font:650 12.5px/1.3 var(--sans);color:var(--ink)}
.gb .size{margin-top:3px;font:500 11.5px/1.3 var(--mono);color:var(--ink-4)}
.gb[data-b="ok"]{--c:var(--ok)}
.gb[data-b="watch"]{--c:var(--watch)}
.gb[data-b="high"]{--c:var(--high)}
.gb[data-b="critical"]{--c:var(--critical);background:var(--crit-bg);border-color:var(--critical)}
.gauge-foot{margin-top:11px;font:400 12.5px/1.6 var(--sans);color:var(--ink-3);max-width:76ch}

/* ── 主体骨架 ─────────────────────────────────────────────────────────── */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 214px;gap:52px;
  max-width:1120px;margin:0 auto;padding:40px 22px 100px}

/* 章节编号有意义：它是**执行顺序**（先体检 → 再交接 → 再看凭据），
   不是装饰性的 01/02/03。所以编号跟着 h2 走，且用等宽。 */
section{margin:0 0 52px;scroll-margin-top:70px}
section>h2{display:flex;align-items:center;gap:11px;font-size:clamp(19px,2.2vw,23px);
  letter-spacing:-.022em;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
section>h2::before{content:attr(data-n);flex:none;font:650 12px/1 var(--mono);color:var(--accent);
  background:var(--accent-soft);border-radius:var(--r);padding:5px 7px;letter-spacing:.02em}
section h3{font-size:15.5px;margin:24px 0 9px;letter-spacing:-.01em}
section p+p{margin-top:11px}
section p,section li{color:var(--ink-2)}
section strong{color:var(--ink);font-weight:650}
ul,ol{margin:11px 0;padding-left:20px}
li{margin:5px 0}
li::marker{color:var(--ink-4)}

/* ── 卡片与网格 ───────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 18px;box-shadow:var(--sh-1)}
.card h3{margin:0 0 7px;font-size:14.5px}
.card h4{margin:0 0 6px;font-size:14px}
.card>pre{margin-top:11px}
/* 实测数字。左边一个大号量值、右边一句话说明它意味着什么——这类内容写成
   散文会被读者跳过，而它恰恰是「凭什么这么做」的全部依据。 */
.metric{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:0 16px;align-items:baseline;
  padding:12px 16px;border:1px solid var(--line);border-left:3px solid var(--high);
  border-radius:var(--r);background:var(--surface);margin:10px 0}
.metric b{font:700 20px/1.15 var(--mono);color:var(--high);letter-spacing:-.01em}
.metric span{color:var(--ink-2);font-size:13.5px}
@media (max-width:560px){.metric{grid-template-columns:1fr;gap:4px}}
.grid{display:grid;gap:12px;margin:14px 0}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* 三种入口是**并列选项**，所以给等宽的三栏与一个可复制的命令，
   而不是叙述性的段落堆叠——读者来这一节只为了挑一个然后照抄。 */
.entry{display:flex;flex-direction:column;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 17px;box-shadow:var(--sh-1)}
.entry .tag{align-self:flex-start;font:650 10.5px/1 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
  padding:5px 7px;border-radius:var(--r)}
.entry h3{margin:0;font-size:15px}
.entry p{flex:1;font-size:13.6px;line-height:1.62}
.entry pre{font-size:12px;padding:11px 13px}

/* 四步是真序列，编号必须在，且要看得出「1 之后是 2」——用一条竖线连起来。 */
.steps{display:grid;gap:0;margin-top:6px}
.step{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;
  padding:0 0 22px 0}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:16px;top:32px;bottom:0;width:1px;background:var(--line)}
.step:last-child::before{display:none}
.step .n{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;
  font:650 13px/1 var(--mono);color:var(--accent-ink);background:var(--accent);
  box-shadow:0 0 0 4px var(--bg)}
.step h4{font-size:15px;margin-bottom:5px}
.step p{font-size:14px}

/* ── 提示条：左边框颜色 = 四档色阶，与量程条同源 ──────────────────────── */
.note{border-left:3px solid var(--info);background:var(--info-bg);
  border-radius:0 var(--r-md) var(--r-md) 0;padding:13px 16px;margin:14px 0}
.note h3{margin:0 0 6px;font-size:14px;color:var(--ink)}
.note p,.note li{font-size:13.6px;color:var(--ink-2)}
.note.warn{border-left-color:var(--high);background:var(--high-bg)}
.note.stop{border-left-color:var(--critical);background:var(--crit-bg)}
.note.good{border-left-color:var(--ok);background:var(--ok-bg)}
.note ul{margin:8px 0 0}

/* ── 表格 ─────────────────────────────────────────────────────────────── */
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.4px}
th{text-align:left;font:650 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-4);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td code{white-space:nowrap}

.pill{display:inline-block;font:650 11.5px/1 var(--sans);padding:5px 9px;border-radius:100px;
  border:1px solid currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.watch{color:var(--watch);background:var(--watch-bg)}
.pill.high{color:var(--high);background:var(--high-bg)}
.pill.critical{color:var(--critical);background:var(--crit-bg)}

/* ── 图 ───────────────────────────────────────────────────────────────── */
figure{margin:20px 0;padding:18px 16px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg)}
figcaption{margin-top:12px;text-align:center;font:500 11.5px/1 var(--mono);
  letter-spacing:.06em;color:var(--ink-4)}

/* ── 目录 ─────────────────────────────────────────────────────────────── */
.toc{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 100px);overflow-y:auto}
.toc h2{font:650 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:11px}
.toc a{display:flex;gap:8px;padding:5px 0 5px 11px;font-size:12.8px;line-height:1.45;
  color:var(--ink-3);text-decoration:none;border-left:2px solid var(--line-soft);
  transition:color .12s,border-color .12s}
.toc a:hover{color:var(--ink)}
.toc a[aria-current="true"]{color:var(--accent);border-left-color:var(--accent);font-weight:650}
.toc a .tn{font:650 10.5px/1.45 var(--mono);color:var(--ink-4);flex:none}
.toc a[aria-current="true"] .tn{color:var(--accent)}

/* ── 响应式：目录先降为顶部横排，再完全让位给正文 ────────────────────── */
@media (max-width:1020px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:0}
  .toc{position:static;max-height:none;order:-1;margin-bottom:30px;
    padding-bottom:16px;border-bottom:1px solid var(--line)}
  .toc a{display:inline-flex;border-left:0;border-bottom:2px solid transparent;
    padding:5px 10px 5px 0;margin-right:6px}
  .toc a[aria-current="true"]{border-left:0;border-bottom-color:var(--accent)}
  .grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .gauge-bars{grid-template-columns:repeat(2,1fr)}
  .grid.g2,.grid.g3{grid-template-columns:minmax(0,1fr)}
  .hero-in{padding:36px 18px 30px}
  .wrap{padding:28px 18px 70px}
  .top{padding:0 16px}
  .top .ver{display:none}
}
@media print{
  .top,.toc{display:none}
  .wrap{grid-template-columns:1fr;padding:0}
  body{background:#fff}
  section{break-inside:avoid}
}

  /* ── 章节 ────────────────────────────────────────────────────────────

  function build() {
    const out = document.getElementById("body");
    while (out.firstChild) out.removeChild(out.firstChild);
    const secs = [];
    let n = 0;
    const sec = (id, hKey, kids) => {
      n += 1;
      const num = String(n).padStart(2, "0");
      const s = h("section", { id: id }, h("h2", { text: g(hKey), "data-n": num }));
      kids.forEach((k) => k && s.appendChild(k));

    sec("s1", "s1.h", [
      rich("p", "s1.p1"),
      // 四样丢失的东西是并列、等重的。用网格而不是项目符号：项目符号读起来
      // 像「还有别的」，网格读起来像「就这四样，全丢」。
      h("div.grid.g2", null,
        ...["s1.li1", "s1.li2", "s1.li3", "s1.li4"].map((k) => h("div.card", null, rich("p", k)))),
      rich("p", "s1.p2")

    const resumeCases = h("table", null,
      h("thead", null, h("tr", null,

  /* 当前章节高亮。用 aria-current 而不是自定义 class：它同时驱动样式与读屏。 */
  function mark() {
    const links = Array.from(document.querySelectorAll(".toc a"));
    let best = null, bestTop = -Infinity;
    links.forEach((a) => {
      const el = document.getElementById(a.getAttribute("href").slice(1));
      if (!el) return;
      const top = el.getBoundingClientRect().top - 96;
      if (top <= 0 && top > bestTop) { bestTop = top; best = a; }
    });
    links.forEach((a) => {
      if (a === best) a.setAttribute("aria-current", "true");
      else a.removeAttribute("aria-current");
    });
  }

  function setLang(code) {
    if (!T[code]) return;
    lang = code;
    try { localStorage.setItem("ah.guide.lang", code); } catch (e) {}
    document.documentElement.lang = code;
    document.title = g("title");
    Array.from(document.querySelectorAll("[data-g]")).forEach((el) => {
      el.textContent = g(el.getAttribute("data-g"));
    });
    Array.from(document.querySelectorAll("#lang-seg button")).forEach((b) => {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === code));
    });
    gauge();
    build();
  }

  function setTheme(mode) {
    document.documentElement.setAttribute("data-theme", mode);
    try { localStorage.setItem("ah.guide.theme", mode); } catch (e) {}
    Array.from(document.querySelectorAll("#theme-seg button")).forEach((b) => {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-set") === mode));
    });
  }

  const seg = document.getElementById("lang-seg");
  ORDER.filter((c) => T[c]).forEach((c) => {
    const b = h("button", { text: SHORT[c], title: T[c]["dir_note"] || c, "data-lang": c });
    b.addEventListener("click", () => setLang(c));
    seg.appendChild(b);
  });
  Array.from(document.querySelectorAll("#theme-seg button")).forEach((b) => {
    b.addEventListener("click", () => setTheme(b.getAttribute("data-theme-set")));
  });

  document.getElementById("ver").textContent = "v2.8.2";

  let savedTheme = null;
  try { savedTheme = localStorage.getItem("ah.guide.theme"); } catch (e) {}
  setTheme(savedTheme || "auto");
  setLang(lang);
  window.addEventListener("scroll", mark, { passive: true });

  /* 章节是 setLang 之后才建出来的，所以带 #hash 打开时目标元素在浏览器
     处理哈希的那一刻还不存在——链接看起来「没反应」。建完再滚一次。
     用 replace 而不是重新赋值 hash：避免在历史里多压一条记录。 */
  function jumpToHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (!id) return;
    const target = document.getElementById(id);
    if (target) target.scrollIntoView();
  }
  jumpToHash();
  window.addEventListener("hashchange", jumpToHash);
})();
</script>
</body>
</html>
